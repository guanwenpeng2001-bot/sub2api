# Fork safety net: frontend lint/build and migration filenames.
# No secrets, no deploy, no image push.
name: Fork checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        # Lockfile is pnpm-lock.yaml (no package-lock.json). This is the
        # repo equivalent of npm ci.
        run: pnpm install --frozen-lockfile
      - name: Lint
        # package.json "lint" passes --fix; CI uses lint:check (same eslint,
        # no working-tree writes).
        run: pnpm run lint:check
      - name: Build
        run: pnpm run build

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check migration filenames
        # Runner keys by filename and applies in lexicographic order
        # (internal/repository/migrations_runner.go). This tree already has
        # parallel files sharing a numeric prefix (e.g. 028_*.sql) and gaps
        # (017, 021–023, 025, 146, …); those are historical and allowed.
        # Require SQL migrations and valid names with 3-digit padding.
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path("backend/migrations")
          if not root.is_dir():
              print("missing backend/migrations", file=sys.stderr)
              sys.exit(1)

          pat = re.compile(r"^(\d{3})([a-z]?)_.+\.sql$")
          files = sorted(p.name for p in root.iterdir() if p.suffix == ".sql")
          if not files:
              print("no SQL migration files", file=sys.stderr)
              sys.exit(1)

          errors = [f"invalid name: {name}" for name in files if not pat.fullmatch(name)]

          if errors:
              print("migration check failed:", file=sys.stderr)
              for err in errors:
                  print(f"  {err}", file=sys.stderr)
              sys.exit(1)

          PY
